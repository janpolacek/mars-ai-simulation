<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AF-03 Asteria Field local landing ellipse and operations map</title>
  <desc id="desc">Red Horizon schematic 8 by 6 kilometre local operations frame centred at 17.80 degrees south and 332.20 degrees east. Shows a 6.4 by 3.2 kilometre fictional landing ellipse, inner touchdown zone P0, science zones S1 to S4, hazards, routes, a communications-safe shoulder, north arrow, scale and legend.</desc>
